[package]
name = "whose"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Whose port or socket is this?"
license = "MIT"
readme = "README.md"
keywords = ["port", "socket", "netlink", "tui", "linux"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "whose"
path = "src/main.rs"

[dependencies]
axum = "0.8.1"
chrono = { version = "0.4.39", default-features = false, features = ["std", "clock"] }
clap = { version = ">=4.5.23, <4.5.58", features = ["derive"] }
clap_lex = ">=0.7.4, <1.0"
tokio-util = ">=0.7.12, <0.7.20"
# Transitive pins: newer releases need Rust 1.85+ / edition 2024.
instability = ">=0.3.1, <0.3.11"
darling = ">=0.20, <0.23"
crossterm = "0.28.1"
humantime = "2.1.0"
libc = "0.2.169"
nix = { version = "0.29.0", features = ["signal", "process", "user"] }
owo-colors = "4.1.0"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = ">=1.43, <1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Pins keep the graph on Rust 1.83. Newer releases of these crates need 1.85.
hyper-util = ">=0.1.10, <0.1.21"
unicode-segmentation = ">=1.10, <1.13"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.7.0"
netlink-packet-sock-diag = "0.4.2"
netlink-sys = "0.8.7"
